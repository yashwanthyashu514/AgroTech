version: '3.8'

services:
  # ── PostgreSQL Database ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: agrotech_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agrotech_db
      POSTGRES_USER: ${DB_USER:-agrotech_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-agrotech_secure_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-agrotech_admin} -d agrotech_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Qdrant Vector Database for Agricultural RAG ──────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: agrotech_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # ── Redis Cache & Rate Limiting ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: agrotech_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # ── AgroTech FastAPI Backend + AI Multimodal Agent ──────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: agrotech_backend
    restart: unless-stopped
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgresql://${DB_USER:-agrotech_admin}:${DB_PASSWORD:-agrotech_secure_pass_2026}@postgres:5432/agrotech_db
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - ./backend/models_store:/app/backend/models_store
      - ./data_pipeline/manifests:/app/data_pipeline/manifests
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 3

  # ── AgroTech React Frontend ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: agrotech_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  qdrant_data:
